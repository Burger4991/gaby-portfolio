<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaby Portfolio — Layout Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Production theme tokens (mirror src/app/globals.css exactly) ─── */
    html[data-theme="dark"], html:not([data-theme]) {
      --color-bg: #0C0C0E; --color-surface: #111116; --color-border: #1F1F25;
      --color-text: #EDE8DF; --color-muted: #5C5349; --color-accent: #B8965A;
      --color-accent-hover: #CCA96A; --color-card-bg: #18181E;
      --color-text-label-xs: 0.55rem; --color-text-label: 0.7rem;
      --color-text-body: 0.875rem; --color-tracking-wide: 0.3em;
    }
    html[data-theme="latte"] {
      --color-bg: #eff1f5; --color-surface: #e6e9ef; --color-border: #ccd0da;
      --color-text: #4c4f69; --color-muted: #6c6f85; --color-accent: #8839ef;
      --color-accent-hover: #9b4ff5; --color-card-bg: #dce0e8;
    }
    html[data-theme="frappe"] {
      --color-bg: #303446; --color-surface: #414559; --color-border: #51576d;
      --color-text: #c6d0f5; --color-muted: #a5adce; --color-accent: #ca9ee6;
      --color-accent-hover: #d8b1ef; --color-card-bg: #292c3c;
    }
    html[data-theme="catppuccin"] {
      --color-bg: #1e1e2e; --color-surface: #313244; --color-border: #45475a;
      --color-text: #cdd6f4; --color-muted: #a6adc8; --color-accent: #cba6f7;
      --color-accent-hover: #d8b5ff; --color-card-bg: #181825;
    }

    /* ─── UI Chrome Tokens (not canvas, not production) ─── */
    :root {
      --ui-bg: #0a0a0a;
      --ui-panel: #111;
      --ui-border: #222;
      --ui-text: #ccc;
      --ui-muted: #666;
      --ui-accent: #B8965A;
      --ui-hover: #1a1a1a;
    }

    /* ─── Reset ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── Shell ─── */
    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: var(--ui-bg);
      color: var(--ui-text);
      font-family: 'Manrope', -apple-system, sans-serif;
      font-size: 13px;
    }

    /* ─── Left Panel ─── */
    #left-panel {
      width: 280px;
      min-width: 280px;
      background: var(--ui-panel);
      border-right: 1px solid var(--ui-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.25s ease, min-width 0.25s ease;
      position: relative;
      flex-shrink: 0;
    }
    #left-panel.collapsed { width: 0; min-width: 0; }
    #left-panel-inner {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }
    #left-panel-inner::-webkit-scrollbar { width: 4px; }
    #left-panel-inner::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    /* ─── Canvas Area ─── */
    #canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ─── Canvas Top Bar ─── */
    #canvas-topbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 0.75rem;
      height: 38px;
      background: var(--ui-panel);
      border-bottom: 1px solid var(--ui-border);
      flex-shrink: 0;
    }
    .tab-btn {
      padding: 0.25rem 0.75rem;
      background: none;
      border: none;
      color: var(--ui-muted);
      cursor: pointer;
      font-family: 'Manrope', sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-bottom: 2px solid transparent;
      height: 100%;
      transition: color 0.15s;
    }
    .tab-btn:hover { color: var(--ui-text); }
    .tab-btn.active { color: var(--ui-text); border-bottom-color: var(--ui-accent); }
    #canvas-topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* ─── Canvas Scroll ─── */
    #canvas-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: #1c1c1c;
    }
    #canvas-scroll::-webkit-scrollbar { width: 6px; }
    #canvas-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    /* ─── Canvas Inner ─── */
    #canvas {
      min-height: 100%;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ─── Canvas Device Frame ─── */
    #canvas-frame {
      width: 100%;
      max-width: 1440px;
      background: var(--color-bg);
      color: var(--color-text);
      position: relative;
      border: 1px solid var(--ui-border);
      border-radius: 4px;
      overflow: hidden;
      font-family: 'Manrope', sans-serif;
    }

    /* ─── Right Panel ─── */
    #right-panel {
      width: 240px;
      min-width: 240px;
      background: var(--ui-panel);
      border-left: 1px solid var(--ui-border);
      overflow: hidden;
      transition: width 0.25s ease, min-width 0.25s ease;
      position: relative;
      flex-shrink: 0;
    }
    #right-panel.collapsed { width: 0; min-width: 0; }
    #right-panel-inner {
      width: 240px;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* ─── Panel Toggle Buttons ─── */
    .panel-toggle {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 48px;
      background: var(--ui-panel);
      border: 1px solid var(--ui-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ui-muted);
      font-size: 9px;
      z-index: 20;
      transition: color 0.15s;
    }
    .panel-toggle:hover { color: var(--ui-text); }
    #left-toggle { right: -16px; border-radius: 0 4px 4px 0; border-left: none; }
    #right-toggle { left: -16px; border-radius: 4px 0 0 4px; border-right: none; }

    /* ─── Panel Headers ─── */
    .panel-title {
      padding: 0.6rem 0.75rem;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ui-muted);
      border-bottom: 1px solid var(--ui-border);
      user-select: none;
    }

    /* ─── Accordion Panels ─── */
    .ctrl-panel {
      border-bottom: 1px solid var(--ui-border);
    }
    .ctrl-panel-header {
      padding: 0.5rem 0.75rem;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ui-muted);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      transition: color 0.15s;
    }
    .ctrl-panel-header:hover { color: var(--ui-text); }
    .ctrl-panel-header .chevron { transition: transform 0.2s; font-size: 8px; }
    .ctrl-panel.open .ctrl-panel-header .chevron { transform: rotate(180deg); }
    .ctrl-panel-body {
      display: none;
      padding: 0.5rem 0.75rem 0.75rem;
    }
    .ctrl-panel.open .ctrl-panel-body { display: block; }

    /* ─── Control Widgets ─── */
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.45rem;
    }
    .ctrl-label {
      font-size: 10px;
      color: var(--ui-muted);
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 80px;
    }
    .ctrl-val {
      font-size: 10px;
      color: var(--ui-text);
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      flex: 1;
      height: 3px;
      accent-color: var(--ui-accent);
      cursor: pointer;
    }
    input[type="color"] {
      width: 24px;
      height: 20px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
      border-radius: 3px;
    }
    select {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid var(--ui-border);
      color: var(--ui-text);
      font-family: 'Manrope', sans-serif;
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
    }
    .ctrl-btn-group {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      margin-bottom: 0.45rem;
    }
    .ctrl-btn {
      background: #1a1a1a;
      border: 1px solid var(--ui-border);
      color: var(--ui-muted);
      font-family: 'Manrope', sans-serif;
      font-size: 9px;
      padding: 2px 7px;
      border-radius: 3px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { color: var(--ui-text); border-color: #444; }
    .ctrl-btn.active {
      background: color-mix(in srgb, var(--ui-accent) 15%, transparent);
      border-color: var(--ui-accent);
      color: var(--ui-accent);
    }
    .ctrl-divider {
      height: 1px;
      background: var(--ui-border);
      margin: 0.5rem 0;
    }
    .ctrl-section-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ui-muted);
      margin-bottom: 0.35rem;
      opacity: 0.7;
    }
    input[type="text"], textarea {
      background: #1a1a1a;
      border: 1px solid var(--ui-border);
      color: var(--ui-text);
      font-family: 'Manrope', sans-serif;
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 3px;
      width: 100%;
    }
    textarea { resize: vertical; min-height: 48px; }

    /* ─── Scale Preview Bars ─── */
    .scale-preview {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 0.45rem;
    }
    .scale-bar-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .scale-bar {
      height: 6px;
      background: color-mix(in srgb, var(--ui-accent) 40%, transparent);
      border-radius: 1px;
      min-width: 2px;
    }
    .scale-bar-label {
      font-size: 8px;
      color: var(--ui-muted);
      font-variant-numeric: tabular-nums;
      min-width: 28px;
    }

    /* ─── Color Picker Grid ─── */
    .color-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.3rem;
      margin-bottom: 0.45rem;
    }
    .color-row {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .color-row label { font-size: 9px; color: var(--ui-muted); flex: 1; }

    /* ─── Theme Tabs ─── */
    .theme-tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 0.5rem;
    }
    .theme-tab {
      flex: 1;
      padding: 3px 0;
      border: 1px solid var(--ui-border);
      background: #1a1a1a;
      color: var(--ui-muted);
      font-size: 8px;
      cursor: pointer;
      text-align: center;
      border-radius: 3px;
      letter-spacing: 0.05em;
      transition: all 0.15s;
    }
    .theme-tab.active { border-color: var(--ui-accent); color: var(--ui-accent); }

    /* ─── Type Specimen Strip ─── */
    .type-specimen {
      background: #1a1a1a;
      border: 1px solid var(--ui-border);
      border-radius: 3px;
      padding: 0.5rem;
      margin-bottom: 0.45rem;
      overflow: hidden;
    }
    .type-specimen .specimen-h1 {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      line-height: 1;
      color: var(--color-text, #EDE8DF);
    }
    .type-specimen .specimen-body {
      font-family: 'Manrope', sans-serif;
      color: color-mix(in srgb, var(--color-text, #EDE8DF) 70%, transparent);
      margin-top: 4px;
    }
    .type-specimen .specimen-label {
      font-family: 'Manrope', sans-serif;
      text-transform: uppercase;
      color: var(--color-accent, #B8965A);
      margin-top: 4px;
    }

    /* ─── Section Order List ─── */
    .order-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 0.45rem;
    }
    .order-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 5px;
      background: #1a1a1a;
      border: 1px solid var(--ui-border);
      border-radius: 3px;
      cursor: grab;
      font-size: 10px;
      color: var(--ui-text);
      user-select: none;
    }
    .order-item:active { cursor: grabbing; }
    .order-item.drag-over { border-color: var(--ui-accent); background: color-mix(in srgb, var(--ui-accent) 10%, transparent); }
    .order-item .drag-dot { color: var(--ui-muted); font-size: 8px; }

    /* ─── Snapshot List ─── */
    .snapshot-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 0.45rem;
    }
    .snapshot-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 5px;
      background: #1a1a1a;
      border: 1px solid var(--ui-border);
      border-radius: 3px;
      font-size: 9px;
      color: var(--ui-text);
    }
    .snapshot-item .snap-actions { display: flex; gap: 3px; }
    .snap-btn {
      background: none;
      border: none;
      color: var(--ui-muted);
      cursor: pointer;
      font-size: 9px;
      padding: 0 2px;
    }
    .snap-btn:hover { color: var(--ui-accent); }

    /* ─── Canvas Blocks ─── */
    .canvas-block {
      position: relative;
      width: 100%;
      border: 2px solid transparent;
      transition: border-color 0.15s;
      cursor: pointer;
    }
    .canvas-block:hover { border-color: color-mix(in srgb, var(--ui-accent) 30%, transparent); }
    .canvas-block.selected { border-color: var(--ui-accent); }
    .canvas-block.drag-over-block { border-color: var(--ui-accent); border-style: dashed; }

    .block-handle {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 20px;
      background: color-mix(in srgb, var(--ui-accent) 10%, rgba(0,0,0,0.5));
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
      z-index: 10;
      cursor: grab;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .canvas-block:hover .block-handle { opacity: 1; }
    .block-handle-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
    }
    .block-handle-grip {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }
    .canvas-block.pinned .block-handle { cursor: default; }

    /* ─── Block: Navbar ─── */
    .block-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2.5rem;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
    }
    .block-navbar.variant-persistent {
      padding: 0.75rem 2.5rem;
    }
    .navbar-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      color: var(--color-text);
    }
    .navbar-hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }
    .navbar-hamburger span {
      display: block;
      width: 20px;
      height: 1px;
      background: var(--color-text);
    }
    .navbar-links {
      display: none;
      gap: 2rem;
    }
    .navbar-links a {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-muted);
      text-decoration: none;
    }
    .block-navbar.variant-persistent .navbar-links { display: flex; }
    .block-navbar.variant-persistent .navbar-hamburger { display: none; }
    .block-navbar.variant-bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      top: auto;
      border-top: 1px solid var(--color-border);
      border-bottom: none;
    }

    /* ─── Block: Hero ─── */
    .block-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: var(--color-bg);
    }
    .block-hero.variant-split {
      flex-direction: row;
    }
    .block-hero.variant-minimal {
      min-height: 60vh;
    }
    .hero-image-placeholder {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, color-mix(in srgb, var(--color-surface) 80%, transparent), var(--color-bg));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-image-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
    }
    .hero-eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 1rem;
      font-family: 'Manrope', sans-serif;
    }
    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      line-height: 1;
      color: var(--color-text);
    }
    .hero-stats {
      display: flex;
      gap: 2.5rem;
      justify-content: center;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    .hero-stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.5rem;
      color: var(--color-text);
      display: block;
    }
    .hero-stat-label {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    .hero-cta {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.75rem 2.5rem;
      border: 1px solid var(--color-accent);
      color: var(--color-accent);
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-decoration: none;
      font-family: 'Manrope', sans-serif;
      transition: background 0.2s;
    }
    .hero-cta:hover { background: color-mix(in srgb, var(--color-accent) 15%, transparent); }

    /* ─── Block: Marquee ─── */
    .block-marquee {
      padding: 1.25rem 0;
      border-top: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg);
      overflow: hidden;
    }
    .marquee-track {
      display: flex;
      white-space: nowrap;
      animation: marquee 30s linear infinite;
    }
    .marquee-track:hover { animation-play-state: paused; }
    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    .marquee-item {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--color-muted);
      padding: 0 2rem;
    }
    .marquee-sep {
      color: var(--color-accent);
      padding: 0 0.5rem;
    }

    /* ─── Block: Portfolio ─── */
    .block-portfolio {
      background: var(--color-bg);
      padding: 2.5rem 2rem 1.5rem;
    }
    .portfolio-eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
      font-family: 'Manrope', sans-serif;
    }
    .portfolio-heading {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      color: var(--color-text);
      margin-bottom: 0.75rem;
    }
    /* Accordion variant */
    .portfolio-accordion {
      display: flex;
      height: 70vh;
      gap: 6px;
    }
    .accordion-panel {
      flex: 0.8;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      cursor: pointer;
      transition: flex 0.4s ease;
      background: var(--color-surface);
    }
    .accordion-panel.active { flex: 5; }
    .accordion-panel-img {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--color-surface), var(--color-card-bg));
      opacity: 0.6;
    }
    .accordion-panel-label {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      right: 1.5rem;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1rem, 2vw, 2rem);
      color: rgba(255,255,255,0.9);
      writing-mode: vertical-lr;
      transform: rotate(180deg);
      transition: writing-mode 0.3s, transform 0.3s;
    }
    .accordion-panel.active .accordion-panel-label {
      writing-mode: horizontal-tb;
      transform: none;
      font-size: clamp(1.8rem, 3vw, 3rem);
    }
    /* Card Grid variant */
    .portfolio-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .portfolio-card {
      aspect-ratio: 3/2;
      background: var(--color-surface);
      border-radius: 4px;
      display: flex;
      align-items: flex-end;
      padding: 1rem;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .portfolio-card:hover { transform: scale(0.99); }
    .portfolio-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 60%);
    }
    .portfolio-card-label {
      position: relative;
      z-index: 1;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: #fff;
    }
    /* Strip variant */
    .portfolio-strip {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }
    .portfolio-strip::-webkit-scrollbar { height: 3px; }
    .portfolio-strip::-webkit-scrollbar-thumb { background: var(--color-border); }
    .portfolio-strip-item {
      flex-shrink: 0;
      width: 240px;
      aspect-ratio: 3/4;
      background: var(--color-surface);
      border-radius: 4px;
      display: flex;
      align-items: flex-end;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }
    /* Tabs variant */
    .portfolio-tabs-nav {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 1rem;
    }
    .portfolio-tab-btn {
      padding: 0.75rem 1.5rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--color-muted);
      font-family: 'Manrope', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: -1px;
    }
    .portfolio-tab-btn.active { color: var(--color-text); border-bottom-color: var(--color-accent); }
    .portfolio-tabs-content {
      aspect-ratio: 16/7;
      background: var(--color-surface);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── Block: PullQuote ─── */
    .block-pullquote {
      background: var(--color-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pullquote-inner {
      max-width: 896px;
      margin: 0 auto;
      text-align: center;
      padding: 5rem 1.5rem;
    }
    .block-pullquote.variant-left-accent .pullquote-inner {
      text-align: left;
      max-width: 700px;
      padding-left: 2rem;
      border-left: 2px solid var(--color-accent);
    }
    .block-pullquote.variant-edge-bleed {
      margin-top: -4rem;
      padding-top: 4rem;
    }
    .pullquote-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      line-height: 1.3;
      color: var(--color-text);
    }
    .pullquote-attr {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-top: 1.5rem;
      font-family: 'Manrope', sans-serif;
    }

    /* ─── Block: About ─── */
    .block-about {
      background: var(--color-bg);
      padding: 6rem 2.5rem;
    }
    .about-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: center;
    }
    .about-eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 1rem;
      font-family: 'Manrope', sans-serif;
    }
    .about-heading {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      line-height: 1.15;
      color: var(--color-text);
      margin-bottom: 1.5rem;
    }
    .about-body {
      color: var(--color-muted);
      line-height: 1.7;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }
    .about-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .skill-pill {
      padding: 0.25rem 0.65rem;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      font-size: 0.7rem;
      color: var(--color-muted);
      font-family: 'Manrope', sans-serif;
      letter-spacing: 0.05em;
    }
    .about-image {
      aspect-ratio: 4/5;
      background: linear-gradient(160deg, var(--color-surface), var(--color-card-bg));
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-border);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
    }

    /* ─── Block: Contact ─── */
    .block-contact {
      background: var(--color-bg);
      padding: 6rem 2.5rem;
    }
    .contact-inner {
      max-width: 672px;
      margin: 0 auto;
      text-align: center;
    }
    .contact-eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 1rem;
      font-family: 'Manrope', sans-serif;
    }
    .contact-heading {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      color: var(--color-text);
      margin-bottom: 1rem;
    }
    .contact-ctas {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .contact-cta {
      padding: 0.75rem 2rem;
      border: 1px solid var(--color-accent);
      color: var(--color-accent);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-family: 'Manrope', sans-serif;
      cursor: pointer;
      background: none;
    }
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }
    .form-field input, .form-field textarea {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      font-family: 'Manrope', sans-serif;
      font-size: 0.875rem;
      padding: 0.75rem 1rem;
      width: 100%;
      border-radius: 0;
    }
    .form-field textarea { height: 100px; resize: vertical; }
    .form-label {
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.25rem;
      display: block;
      font-family: 'Manrope', sans-serif;
    }

    /* ─── Block: Footer ─── */
    .block-footer {
      background: var(--color-bg);
      border-top: 1px solid var(--color-border);
      padding: 2rem;
      text-align: center;
    }
    .footer-text {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-muted);
      font-family: 'Manrope', sans-serif;
    }

    /* ─── Scroll Progress Bar ─── */
    #progress-bar {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      background: var(--color-accent, #B8965A);
      width: 0%;
      z-index: 9999;
      transition: width 0.1s;
      pointer-events: none;
    }
    #section-dots {
      position: fixed;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
      pointer-events: none;
    }
    .section-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-border, #333);
    }
    .section-dot.active { background: var(--color-accent, #B8965A); }

    /* ─── Collection Mode Blocks ─── */
    .block-collection-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 2rem;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .collection-header-back {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-muted);
      cursor: pointer;
      font-family: 'Manrope', sans-serif;
    }
    .collection-header-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--color-text);
    }

    .block-collection-section {
      display: grid;
      min-height: 100vh;
      background: var(--color-bg);
    }
    .collection-text-side {
      padding: 4rem 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spotlight-card {
      max-width: 420px;
      padding: 2.5rem;
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      border-radius: 12px;
    }
    .spotlight-card-eyebrow {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.75rem;
      font-family: 'Manrope', sans-serif;
    }
    .spotlight-card-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.5rem, 2vw, 2.5rem);
      color: var(--color-text);
      margin-bottom: 1rem;
    }
    .spotlight-card-desc {
      font-size: 0.875rem;
      color: var(--color-muted);
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .spotlight-card-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .spotlight-pill {
      padding: 0.2rem 0.6rem;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      font-size: 0.62rem;
      color: var(--color-muted);
      font-family: 'Manrope', sans-serif;
    }
    .collection-image-side {
      padding: 4rem 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .carousel-placeholder {
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.5rem;
      color: var(--color-muted);
      font-family: 'Manrope', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
    }
    .carousel-3d-icon {
      font-size: 2rem;
      opacity: 0.3;
    }

    /* Image layout variants in collection */
    .masonry-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }
    .masonry-item {
      background: var(--color-surface);
      border-radius: 4px;
    }
    .masonry-item:nth-child(2) { grid-row: span 2; }
    .filmstrip {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
    }
    .filmstrip-item {
      flex-shrink: 0;
      background: var(--color-surface);
      border-radius: 4px;
    }
    .tiled-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .tiled-item {
      background: var(--color-surface);
      border-radius: 4px;
    }

    /* ─── Lightbox ─── */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    #lightbox.open { display: flex; }
    .lightbox-inner {
      display: flex;
      align-items: center;
      gap: 1rem;
      max-width: 1100px;
      max-height: 90vh;
    }
    .lightbox-img-wrap {
      background: var(--color-surface, #111116);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .lightbox-img-placeholder {
      width: 300px;
      background: linear-gradient(135deg, var(--color-surface, #111116), var(--color-card-bg, #18181E));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-muted, #5C5349);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
    }
    .lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 2rem;
      height: 2rem;
      cursor: pointer;
      border-radius: 50%;
      font-size: 1rem;
    }

    /* ─── Inspector ─── */
    .inspector-section {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--ui-border);
    }
    .inspector-block-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--ui-accent);
      margin-bottom: 0.4rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .inspector-empty {
      padding: 1rem 0.75rem;
      font-size: 11px;
      color: var(--ui-muted);
      font-style: italic;
    }

    /* ─── All-Themes Grid ─── */
    #all-themes-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 9998;
      display: none;
      overflow-y: auto;
      padding: 1rem;
    }
    #all-themes-overlay.open { display: block; }
    .all-themes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.5rem 1rem;
    }
    .all-themes-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ui-muted);
    }
    .all-themes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .theme-preview-frame {
      border: 1px solid var(--ui-border);
      border-radius: 4px;
      overflow: hidden;
    }
    .theme-preview-label {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.5rem;
      background: var(--ui-panel);
      color: var(--ui-muted);
      border-bottom: 1px solid var(--ui-border);
    }

    /* ─── Floating Buttons (on canvas) ─── */
    .canvas-float-group {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: flex-end;
      z-index: 100;
    }
    .canvas-float-btn {
      padding: 0.35rem 0.85rem;
      background: color-mix(in srgb, var(--color-bg) 70%, transparent);
      backdrop-filter: blur(12px);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      color: var(--color-text);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      font-family: 'Manrope', sans-serif;
    }
  </style>
</head>
<body>
  <!-- Lightbox (global overlay) -->
  <div id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <div class="lightbox-inner" id="lightbox-inner"></div>
  </div>

  <!-- All Themes Overlay -->
  <div id="all-themes-overlay">
    <div class="all-themes-header">
      <span class="all-themes-title">All Themes Preview</span>
      <button class="ctrl-btn" onclick="toggleAllThemes(false)">Close ×</button>
    </div>
    <div class="all-themes-grid" id="all-themes-grid"></div>
  </div>

  <!-- Left Panel -->
  <div id="left-panel">
    <button class="panel-toggle" id="left-toggle" onclick="togglePanel('left')">‹</button>
    <div id="left-panel-inner">
      <div class="panel-title">Controls</div>
      <!-- panels injected by JS -->
    </div>
  </div>

  <!-- Canvas Area -->
  <div id="canvas-area">
    <div id="canvas-topbar">
      <button class="tab-btn active" onclick="switchMode('homepage')">Homepage</button>
      <button class="tab-btn" onclick="switchMode('collection')">Collection</button>
      <div id="canvas-topbar-right">
        <span id="device-label" style="font-size:10px;color:var(--ui-muted);letter-spacing:0.1em;"></span>
      </div>
    </div>
    <div id="canvas-scroll">
      <div id="canvas">
        <div id="canvas-frame">
          <!-- blocks rendered here by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div id="right-panel">
    <button class="panel-toggle" id="right-toggle" onclick="togglePanel('right')">›</button>
    <div id="right-panel-inner">
      <div class="panel-title">Inspector</div>
      <div id="inspector-content"><div class="inspector-empty">Click a block to inspect</div></div>
    </div>
  </div>

  <script>
    // ─── State ───────────────────────────────────────────────────
    const THEMES = {
      dark:        { bg:'#0C0C0E', surface:'#111116', border:'#1F1F25', text:'#EDE8DF', muted:'#5C5349', accent:'#B8965A', cardBg:'#18181E', glowIntensity:1, blurAmount:12 },
      latte:       { bg:'#eff1f5', surface:'#e6e9ef', border:'#ccd0da', text:'#4c4f69', muted:'#6c6f85', accent:'#8839ef', cardBg:'#dce0e8', glowIntensity:0.5, blurAmount:8 },
      frappe:      { bg:'#303446', surface:'#414559', border:'#51576d', text:'#c6d0f5', muted:'#a5adce', accent:'#ca9ee6', cardBg:'#292c3c', glowIntensity:0.7, blurAmount:10 },
      catppuccin:  { bg:'#1e1e2e', surface:'#313244', border:'#45475a', text:'#cdd6f4', muted:'#a6adc8', accent:'#cba6f7', cardBg:'#181825', glowIntensity:0.8, blurAmount:10 },
    };

    const DEFAULT_STATE = {
      mode: 'homepage',
      // P1: Layout Grid
      containerWidth: 1440,
      containerFullBleed: true,
      sectionOrder: ['hero','marquee','portfolio','pullquote','about','contact'],
      sectionHeights: { hero:'100vh', marquee:'auto', portfolio:'100vh', pullquote:'100vh', about:'auto', contact:'auto' },
      // P2: Spacing
      baseUnit: 8,
      sectionPaddingV: 6,
      sectionPaddingH: 3,
      componentGap: 2,
      // P3: Typography
      headingClampMin: 3, headingClampVw: 10, headingClampMax: 8,
      bodySize: 1,
      labelSize: 0.7, labelTracking: 0.3,
      trackingTight: 0.1, trackingNormal: 0.2, trackingWide: 0.3,
      // P4: Theme
      activeTheme: 'dark',
      themeColors: JSON.parse(JSON.stringify(THEMES)),
      allThemesView: false,
      // P5: Collection Layout
      gridSplit: 40,
      carouselHeight: 320,
      carouselFaceWidth: 220,
      headerBehavior: 'sticky',
      // P6: Variants
      accordionVariant: 'accordion',
      pullQuoteVariant: 'centered',
      heroVariant: 'scroll-expand',
      // P7: Navigation
      navbarVariant: 'hamburger',
      scrollIndicator: 'progress',
      sectionTransition: 'hard',
      // P8: Motion
      cursorVariant: 'custom',
      glowIntensity: 1,
      liquidBlur: 12,
      accentGlow: 20,
      scrollBehavior: 'smooth',
      preloaderEnabled: true,
      preloaderDuration: 2,
      // P9: Image Presentation
      lightboxAspect: '3/4',
      imageLayout: 'carousel',
      mobileImageLayout: 'strip',
      // P10: Responsive
      deviceWidth: 0, // 0 = full
      sideBySide: false,
      // P11: Snapshots (runtime only)
      // Inspector
      selectedBlock: null,
      blockVisibility: {},
      blockPaddingOverrides: {},
      blockNotes: {},
      // Collection
      collectionSectionCount: 3,
    };

    let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    // Load saved state if exists
    try {
      const saved = localStorage.getItem('gaby-playground-state');
      if (saved) state = Object.assign(state, JSON.parse(saved));
    } catch(e) {}

    function setState(patch) {
      Object.assign(state, patch);
      try { localStorage.setItem('gaby-playground-state', JSON.stringify(state)); } catch(e) {}
      applyState();
    }

    // ─── Core render ────────────────────────────────────────────
    function applyState() {
      applyTheme();
      applyCanvasFrame();
      if (state.mode === 'homepage') renderHomepage();
      else renderCollection();
      applyScrollIndicator();
      applyCursor();
      updatePanelUI();
    }

    function applyTheme() {
      const theme = state.themeColors[state.activeTheme];
      document.documentElement.setAttribute('data-theme', state.activeTheme);
      const frame = document.getElementById('canvas-frame');
      if (!frame) return;
      frame.style.setProperty('--color-bg', theme.bg);
      frame.style.setProperty('--color-surface', theme.surface);
      frame.style.setProperty('--color-border', theme.border);
      frame.style.setProperty('--color-text', theme.text);
      frame.style.setProperty('--color-muted', theme.muted);
      frame.style.setProperty('--color-accent', theme.accent);
      frame.style.setProperty('--color-card-bg', theme.cardBg);
      frame.style.setProperty('--color-accent-hover', theme.accent);
      frame.style.background = theme.bg;
      frame.style.color = theme.text;
    }

    function applyCanvasFrame() {
      const frame = document.getElementById('canvas-frame');
      const deviceW = state.deviceWidth;
      if (deviceW > 0) {
        frame.style.maxWidth = deviceW + 'px';
        frame.style.margin = '0 auto';
        document.getElementById('device-label').textContent = deviceW + 'px';
      } else {
        frame.style.maxWidth = state.containerFullBleed ? '100%' : (state.containerWidth + 'px');
        frame.style.margin = state.containerFullBleed ? '0' : '0 auto';
        document.getElementById('device-label').textContent = state.containerFullBleed ? 'Full Bleed' : (state.containerWidth + 'px');
      }
    }

    // ─── Homepage Renderer ───────────────────────────────────────
    function renderHomepage() {
      const frame = document.getElementById('canvas-frame');
      const theme = state.themeColors[state.activeTheme];
      const pu = state.baseUnit;
      const secPadV = (pu * state.sectionPaddingV) + 'px';
      const secPadH = (pu * state.sectionPaddingH) + 'px';
      const titleSize = `clamp(${state.headingClampMin}rem, ${state.headingClampVw}vw, ${state.headingClampMax}rem)`;

      const blocks = {
        hero: renderHeroBlock(theme, titleSize, secPadV, secPadH),
        marquee: renderMarqueeBlock(theme),
        portfolio: renderPortfolioBlock(theme, secPadV, secPadH),
        pullquote: renderPullQuoteBlock(theme, secPadV, secPadH, titleSize),
        about: renderAboutBlock(theme, secPadV, secPadH, titleSize),
        contact: renderContactBlock(theme, secPadV, secPadH, titleSize),
      };

      const navbarHTML = renderNavbarBlock(theme);
      const footerHTML = renderFooterBlock(theme);

      let sectionsHTML = state.sectionOrder.map(key => {
        if (state.blockVisibility[key] === false) return '';
        const isSelected = state.selectedBlock === key;
        const height = state.sectionHeights[key];
        const heightStyle = height === 'auto' ? '' : height === '100vh' ? 'min-height:100vh;' : `min-height:${height};`;
        return `<div class="canvas-block${isSelected ? ' selected' : ''}" data-id="${key}" draggable="true"
          onclick="selectBlock('${key}')"
          ondragstart="onDragStart(event,'${key}')"
          ondragover="onDragOver(event)"
          ondrop="onDrop(event,'${key}')"
          ondragleave="onDragLeave(event)"
          style="${heightStyle}">
          <div class="block-handle" ondragstart="onDragStart(event,'${key}')">
            <span class="block-handle-grip">⠿</span>
            <span class="block-handle-label">${key}</span>

          ${blocks[key] || ''}

      frame.innerHTML = `
        <div class="canvas-block pinned" data-id="navbar">

        <div style="flex:1;display:flex;align-items:center;padding:${secPadV} ${secPadH}">
          <div class="hero-content" style="text-align:left">
            <div class="hero-eyebrow">Fashion Designer · Miami</div>

        <div class="hero-image-placeholder" style="opacity:0.5;background:linear-gradient(160deg,var(--color-surface),var(--color-card-bg))"></div>

          <span style="font-size:0.62rem;letter-spacing:0.1em;color:var(--color-muted);opacity:0.5">[ Scroll-Expand Hero ]</span>
        </div>
        <div class="hero-content">
          <div class="hero-eyebrow">Fashion Designer · Miami</div>
          <h1 class="hero-title" style="font-size:${titleSize}">Gabriela Gamargo</h1>
          <div class="hero-stats">
            <div><span class="hero-stat-num">10+</span><span class="hero-stat-label">Years</span></div>
            <div><span class="hero-stat-num">5+</span><span class="hero-stat-label">Design Lead</span></div>
            <div><span class="hero-stat-num">300K+</span><span class="hero-stat-label">Units Sold</span></div>

          <a class="hero-cta" href="#">View Work →</a>

    function renderMarqueeBlock(theme) {
      const items = ['Resort &amp; Activewear','Bridal &amp; Eveningwear','Hand Illustrations','Cut &amp; Sew Knits'];
      const doubled = [...items,...items].map(i=>`<span class="marquee-item">${i}<span class="marquee-sep">/</span></span>`).join('');
      return `<div class="block-marquee"><div class="marquee-track">${doubled}</div></div>`;
    }

    function renderPortfolioBlock(theme, secPadV, secPadH) {
      const v = state.accordionVariant;
      const cats = ['Resort &amp; Activewear','Cut &amp; Sew Knits','Bridal &amp; Eveningwear','Hand Illustrations'];
      let inner = '';
      if (v === 'accordion') {
        inner = `<div class="portfolio-accordion">${cats.map((c,i)=>`<div class="accordion-panel${i===0?' active':''}" onclick="this.parentNode.querySelectorAll('.accordion-panel').forEach(p=>p.classList.remove('active'));this.classList.add('active')">
          <div class="accordion-panel-img"></div>
          <div class="accordion-panel-label">${c}</div>
        </div>`).join('')}</div>`;
      } else if (v === 'cards') {
        inner = `<div class="portfolio-cards">${cats.map(c=>`<div class="portfolio-card">
          <div class="portfolio-card-overlay"></div>
          <div class="portfolio-card-label">${c}</div>
        </div>`).join('')}</div>`;
      } else if (v === 'strip') {
        inner = `<div class="portfolio-strip">${cats.map(c=>`<div class="portfolio-strip-item">
          <div class="portfolio-card-overlay"></div>
          <div class="portfolio-card-label" style="position:relative;z-index:1;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.2rem;color:#fff">${c}</div>
        </div>`).join('')}</div>`;
      } else if (v === 'tabs') {
        inner = `<div class="portfolio-tabs-nav">${cats.map((c,i)=>`<button class="portfolio-tab-btn${i===0?' active':''}">${c}</button>`).join('')}</div>
        <div class="portfolio-tabs-content"><span style="font-size:0.7rem;color:var(--color-muted);letter-spacing:0.1em">[ Selected Collection Preview ]</span></div>`;
      }
      return `<div class="block-portfolio" style="padding:${secPadV} ${secPadH}">
        <div class="portfolio-eyebrow">Collections</div>
        <h2 class="portfolio-heading" style="font-size:clamp(1.5rem,3vw,2.5rem)">The Work</h2>
        ${inner}

    function renderPullQuoteBlock(theme, secPadV, secPadH, titleSize) {
      const v = state.pullQuoteVariant;
      if (v === 'hidden') return '';
      return `<div class="block-pullquote variant-${v}" style="padding:${secPadV} ${secPadH}">
        <div class="pullquote-inner">
          <blockquote class="pullquote-text" style="font-size:clamp(1.5rem,3vw,3rem)">
            "Design lives in the balance of opposites — the structured and the fluid, the expected and the surprising."

          <div class="pullquote-attr">— Gabriela Gamargo</div>
        </div>
      </div>`;

    function renderAboutBlock(theme, secPadV, secPadH, titleSize) {
      const skills = ['Creative Direction','Trend Forecasting','Technical Design','Fit &amp; Grading','QC','Product Development','Adobe Illustrator','CLO 3D','PROMEAI'];
      return `<div class="block-about" style="padding:${secPadV} ${secPadH}">
        <div class="about-inner" style="max-width:${state.containerFullBleed?'1200px':state.containerWidth+'px'};margin:0 auto">
          <div>
            <div class="about-eyebrow">About</div>
            <h2 class="about-heading" style="font-size:clamp(2rem,4vw,3.5rem)">The Designer</h2>
            <p class="about-body">Miami-based fashion designer with 10+ years in the industry. Studied at FIDM in Los Angeles and grew into Head of Design at Pitusa. Bilingual (EN/ES).</p>
            <p class="about-body" style="margin-bottom:1.5rem">Specializing in resort, activewear, bridal, and eveningwear with a focus on sustainable sourcing and global vendor relationships.</p>

        </div>

    function renderContactBlock(theme, secPadV, secPadH, titleSize) {
      return `<div class="block-contact" style="padding:${secPadV} ${secPadH}">
        <div class="contact-inner">
          <div class="contact-eyebrow">Contact</div>
          <h2 class="contact-heading" style="font-size:clamp(2rem,4vw,3.5rem)">Say Hello</h2>
          <div class="contact-ctas">
            <button class="contact-cta">Download Resume</button>
            <button class="contact-cta" style="background:var(--color-accent);color:var(--color-bg)">LinkedIn</button>
          </div>
          <form class="contact-form" onsubmit="return false">
            <div class="form-field"><label class="form-label">Name</label><input type="text" placeholder="Your name"></div>
            <div class="form-field"><label class="form-label">Email</label><input type="email" placeholder="your@email.com"></div>
            <div class="form-field"><label class="form-label">Message</label><textarea placeholder="Tell me about your project…"></textarea></div>
            <button class="contact-cta" style="align-self:flex-end">Send →</button>
          </form>
        </div>
      </div>`;
    }

    function renderFooterBlock(theme) {
      return `<div class="block-footer">
        <div class="footer-text">© 2025 Gabriela Gamargo · Miami, FL</div>
      </div>`;
    }

    // ─── Collection Renderer ─────────────────────────────────────
    function renderCollection() {
      const frame = document.getElementById('canvas-frame');
      const theme = state.themeColors[state.activeTheme];
      const leftPct = state.gridSplit + '%';
      const rightPct = (100 - state.gridSplit) + '%';
      const cols = `${leftPct} ${rightPct}`;
      const n = state.collectionSectionCount;

      const sampleSections = [
        { eyebrow: 'Resort 2025', title: 'Stephanie Gottlieb Collab', desc: 'Resort-ready pieces developed in collaboration with Stephanie Gottlieb for her flagship collection.', pills: ['Direction','Moodboard','Tech Packs','Sampling','Final'] },
        { eyebrow: 'AW\'23', title: 'Chunky Knits', desc: 'Cozy, oversized knit silhouettes developed for the AW\'23 collection. Sourced from Peruvian artisans.', pills: ['Concept','Yarn Sourcing','Tech Packs','QC'] },
        { eyebrow: 'Vogue Mexico Feature', title: 'Resort 2025', desc: 'Featured in Vogue Mexico and presented at Miami Swim Week. Resort collection with hand-painted details.', pills: ['Direction','Sampling','Press','Runway'] },
      ];

      let sectionsHTML = Array.from({length: Math.min(n, sampleSections.length)}, (_, i) => {
        const s = sampleSections[i];
        const carouselContent = renderImageSide(theme, i);
        return `<div class="block-collection-section" style="grid-template-columns:${cols};min-height:100vh">
          <div class="collection-text-side">
            <div class="spotlight-card">
              <div class="spotlight-card-eyebrow">${s.eyebrow}</div>
              <div class="spotlight-card-title">${s.title}</div>
              <div class="spotlight-card-desc">${s.desc}</div>
              <div class="spotlight-card-pills">${s.pills.map(p=>`<span class="spotlight-pill">${p}</span>`).join('')}</div>
            </div>
          </div>
          <div class="collection-image-side">${carouselContent}</div>
        </div>`;
      }).join('');

      const headerStyle = state.headerBehavior === 'sticky' ? 'position:sticky;top:0;z-index:10' : state.headerBehavior === 'scroll-away' ? '' : 'position:sticky;top:60px;z-index:10';
      frame.innerHTML = `
        ${renderNavbarBlock(theme)}
        <div class="block-collection-header" style="${headerStyle}">
          <span class="collection-header-back">← Work</span>
          <span class="collection-header-title">Resort &amp; Activewear</span>
        </div>
        ${sectionsHTML}
        ${renderFooterBlock(theme)}
      `;
    }

    function renderImageSide(theme, idx) {
      const v = state.imageLayout;
      const h = state.carouselHeight;
      const w = state.carouselFaceWidth;
      if (v === 'carousel') return `<div class="carousel-placeholder" style="width:${w*3}px;height:${h}px">
        <div class="carousel-3d-icon">⟳</div>
        <span>3D Carousel · ${w}×${h}px</span>
        <span style="opacity:0.4">scroll to rotate</span>
      </div>`;
      if (v === 'masonry') return `<div class="masonry-grid" style="width:100%;max-width:500px">
        ${[1,2,3,4,5].map(i=>`<div class="masonry-item" style="height:${150+Math.random()*80}px;background:color-mix(in srgb,var(--color-accent) ${10+i*5}%,var(--color-surface))"></div>`).join('')}
      </div>`;
      if (v === 'filmstrip') return `<div class="filmstrip" style="width:100%;max-width:500px">
        ${[1,2,3,4].map(i=>`<div class="filmstrip-item" style="width:200px;height:${h}px;background:var(--color-surface)"></div>`).join('')}
      </div>`;
      if (v === 'tiled') return `<div class="tiled-grid" style="width:100%;max-width:500px">
        ${[1,2,3,4].map(i=>`<div class="tiled-item" style="height:200px;background:var(--color-surface)"></div>`).join('')}
      </div>`;
    }

    function applyScrollIndicator() {
      let pb = document.getElementById('progress-bar');
      let sd = document.getElementById('section-dots');
      if (!pb) { pb = document.createElement('div'); pb.id='progress-bar'; document.body.appendChild(pb); }
      if (!sd) { sd = document.createElement('div'); sd.id='section-dots'; document.body.appendChild(sd); }
      pb.style.display = state.scrollIndicator === 'progress' ? 'block' : 'none';
      sd.style.display = state.scrollIndicator === 'dots' ? 'flex' : 'none';
      if (state.scrollIndicator === 'dots') {
        sd.innerHTML = state.sectionOrder.map((_,i)=>`<div class="section-dot${i===0?' active':''}"></div>`).join('');
      }
    }

    function applyCursor() {
      if (state.cursorVariant === 'system') {
        document.getElementById('canvas-frame').style.cursor = 'auto';
      } else {
        document.getElementById('canvas-frame').style.cursor = 'none';
      }
    }

    // ─── Drag and Drop ───────────────────────────────────────────
    let dragSrcId = null;
    function onDragStart(e, id) { dragSrcId = id; e.dataTransfer.effectAllowed = 'move'; }
    function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over-block'); }
    function onDragLeave(e) { e.currentTarget.classList.remove('drag-over-block'); }
    function onDrop(e, targetId) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over-block');
      if (!dragSrcId || dragSrcId === targetId) return;
      const order = [...state.sectionOrder];
      const srcIdx = order.indexOf(dragSrcId);
      const tgtIdx = order.indexOf(targetId);
      if (srcIdx < 0 || tgtIdx < 0) return;
      order.splice(srcIdx, 1);
      order.splice(tgtIdx, 0, dragSrcId);
      setState({ sectionOrder: order });
    }

    // ─── Block Selection / Inspector ─────────────────────────────
    function selectBlock(id) {
      setState({ selectedBlock: id });
      renderInspector(id);
    }

    function renderInspector(id) {
      const container = document.getElementById('inspector-content');
      if (!id) { container.innerHTML = '<div class="inspector-empty">Click a block to inspect</div>'; return; }
      const variants = {
        hero: ['scroll-expand','static','split','minimal'],
        portfolio: ['accordion','cards','strip','tabs'],
        pullquote: ['centered','left-accent','edge-bleed','hidden'],
        navbar: ['hamburger','persistent','sidebar','bottom'],
      };
      const blockVariants = variants[id];
      const currentVariant = {
        hero: state.heroVariant,
        portfolio: state.accordionVariant,
        pullquote: state.pullQuoteVariant,
        navbar: state.navbarVariant,
      }[id];
      const visibility = state.blockVisibility[id] !== false;
      const notes = state.blockNotes[id] || '';

      container.innerHTML = `
        <div class="inspector-section">
          <div class="inspector-block-name">${id}</div>
          ${blockVariants ? `<div class="ctrl-section-label">Variant</div>
          <div class="ctrl-btn-group">
            ${blockVariants.map(v=>`<button class="ctrl-btn${currentVariant===v?' active':''}" onclick="setVariant('${id}','${v}')">${v}</button>`).join('')}
          </div>` : ''}
          <div class="ctrl-row" style="margin-top:0.4rem">
            <span class="ctrl-label">Visible</span>
            <input type="checkbox" ${visibility?'checked':''} onchange="setBlockVisibility('${id}',this.checked)" style="cursor:pointer">
          </div>
          <div class="ctrl-section-label" style="margin-top:0.5rem">Padding Override</div>
          <div class="ctrl-row">
            <span class="ctrl-label">V pad</span>
            <input type="text" value="${state.blockPaddingOverrides[id]?.v||''}" placeholder="auto" oninput="setBlockPadding('${id}','v',this.value)" style="width:60px;flex:none">
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">H pad</span>
            <input type="text" value="${state.blockPaddingOverrides[id]?.h||''}" placeholder="auto" oninput="setBlockPadding('${id}','h',this.value)" style="width:60px;flex:none">
          </div>
          <div class="ctrl-section-label" style="margin-top:0.5rem">Notes</div>
          <textarea oninput="setBlockNote('${id}',this.value)" style="margin-bottom:0">${notes}</textarea>
        </div>
      `;
    }

    function setVariant(blockId, variant) {
      const variantKeys = { hero:'heroVariant', portfolio:'accordionVariant', pullquote:'pullQuoteVariant', navbar:'navbarVariant' };
      const key = variantKeys[blockId];
      if (key) { setState({ [key]: variant }); renderInspector(blockId); }
    }
    function setBlockVisibility(id, visible) {
      const bv = Object.assign({}, state.blockVisibility);
      bv[id] = visible;
      setState({ blockVisibility: bv });
      renderInspector(id);
    }
    function setBlockPadding(id, axis, val) {
      const overrides = Object.assign({}, state.blockPaddingOverrides);
      overrides[id] = Object.assign({}, overrides[id], { [axis]: val });
      state.blockPaddingOverrides = overrides;
      try { localStorage.setItem('gaby-playground-state', JSON.stringify(state)); } catch(e) {}
    }
    function setBlockNote(id, text) {
      const notes = Object.assign({}, state.blockNotes);
      notes[id] = text;
      state.blockNotes = notes;
      try { localStorage.setItem('gaby-playground-state', JSON.stringify(state)); } catch(e) {}
    }

    // ─── Lightbox ────────────────────────────────────────────────
    function openLightbox() {
      const ar = state.lightboxAspect;
      const arMap = { '3/4': [300,400], '16/9': [400,225], '1/1': [350,350], '4/5': [320,400], 'source': [400,300] };
      const [w,h] = arMap[ar] || [300,400];
      document.getElementById('lightbox-inner').innerHTML = `
        <div class="lightbox-img-wrap">
          <div class="lightbox-img-placeholder" style="width:${w}px;height:${h}px">
            <span style="font-size:0.62rem;letter-spacing:0.1em;color:var(--color-muted)">Image · ${ar}</span>
          </div>
        </div>
      `;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

    // ─── All-Themes View ─────────────────────────────────────────
    function toggleAllThemes(show) {
      const overlay = document.getElementById('all-themes-overlay');
      if (show) {
        const grid = document.getElementById('all-themes-grid');
        const themeNames = { dark:'Dark Luxury', latte:'Catppuccin Latte', frappe:'Catppuccin Frappe', catppuccin:'Catppuccin Mocha' };
        grid.innerHTML = Object.entries(themeNames).map(([key, name]) => {
          const t = state.themeColors[key];
          return `<div class="theme-preview-frame">
            <div class="theme-preview-label">${name}</div>
            <div style="background:${t.bg};color:${t.text};padding:1.5rem;font-family:'Manrope',sans-serif">
              <div style="font-size:0.55rem;letter-spacing:0.3em;text-transform:uppercase;color:${t.muted};margin-bottom:0.5rem">Fashion Designer · Miami</div>
              <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.8rem;font-weight:300;line-height:1;color:${t.text};margin-bottom:1rem">Gabriela Gamargo</div>
              <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
                ${['Resort','Bridal','Knits'].map(s=>`<span style="padding:2px 8px;border:1px solid ${t.border};border-radius:3px;font-size:0.55rem;color:${t.muted}">${s}</span>`).join('')}
              </div>
              <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid ${t.border}">
                <span style="color:${t.accent};font-size:0.62rem;letter-spacing:0.2em">Accent Color Sample</span>
              </div>
            </div>
          </div>`;
        }).join('');
        overlay.classList.add('open');
      } else {
        overlay.classList.remove('open');
      }
    }

    // ─── Panel UI Builders ───────────────────────────────────────
    function buildPanels() {
      document.getElementById('left-panel-inner').innerHTML = `
        <div class="panel-title">Controls</div>
        ${buildPanel1()}${buildPanel2()}${buildPanel3()}${buildPanel4()}
        ${buildPanel5()}${buildPanel6()}${buildPanel7()}${buildPanel8()}
        ${buildPanel9()}${buildPanel10()}${buildPanel11()}
      `;
    }

    function buildPanel1() {
      return `<div class="ctrl-panel open" id="panel1">
        <div class="ctrl-panel-header" onclick="toggleCtrlPanel('panel1')">1 · Layout Grid <span class="chevron">▼</span></div>
        <div class="ctrl-panel-body">
          <div class="ctrl-row">
            <span class="ctrl-label">Full Bleed</span>
            <input type="checkbox" id="p1-fullbleed" ${state.containerFullBleed?'checked':''} onchange="setState({containerFullBleed:this.checked})" style="cursor:pointer">
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">Max Width</span>
            <input type="range" id="p1-width" min="672" max="1600" step="16" value="${state.containerWidth}" oninput="setState({containerWidth:+this.value})">
            <span class="ctrl-val" id="p1-width-val">${state.containerWidth}px</span>
          </div>
          <div class="ctrl-divider"></div>
          <div class="ctrl-section-label">Section Heights</div>
          ${['hero','marquee','portfolio','pullquote','about','contact'].map(k=>`
          <div class="ctrl-row">
            <span class="ctrl-label">${k}</span>

          ondragover="event.preventDefault();this.classList.add('drag-over')"

      const order=[...state.sectionOrder];
      const si=order.indexOf(orderDragSrc),ti=order.indexOf(targetId);

      order.splice(si,1);order.splice(ti,0,orderDragSrc);

    // ─── Snapshot / Export ───────────────────────────────────────
    function saveSnapshot() {
      const nameEl = document.getElementById('snap-name');
      const name = (nameEl.value || '').trim() || ('snapshot-' + Date.now());
      try {
        const snaps = JSON.parse(localStorage.getItem('gaby-playground-snapshots') || '{}');
        snaps[name] = JSON.parse(JSON.stringify(state));
        localStorage.setItem('gaby-playground-snapshots', JSON.stringify(snaps));
      } catch(e) { alert('Could not save snapshot: ' + e.message); return; }
      nameEl.value = '';
      buildPanels();
      applyState();
    }

    function loadSnapshot(name) {
      try {
        const snaps = JSON.parse(localStorage.getItem('gaby-playground-snapshots') || '{}');
        if (snaps[name]) { state = Object.assign({}, DEFAULT_STATE, snaps[name]); applyState(); buildPanels(); }
      } catch(e) {}
    }

    function deleteSnapshot(name) {
      try {
        const snaps = JSON.parse(localStorage.getItem('gaby-playground-snapshots') || '{}');
        delete snaps[name];
        localStorage.setItem('gaby-playground-snapshots', JSON.stringify(snaps));
        buildPanels(); applyState();
      } catch(e) {}
    }

    function exportConfig() {
      const theme = state.themeColors[state.activeTheme];
      const pu = state.baseUnit;
      const config = {
        meta: { generated: new Date().toISOString(), theme: state.activeTheme, note: 'Generated by Gaby Portfolio Playground' },
        layout: {
          containerWidth: state.containerFullBleed ? 'full-bleed' : state.containerWidth + 'px',
          sectionOrder: state.sectionOrder,
          sectionHeights: state.sectionHeights,
        },
        spacing: {
          baseUnit: pu + 'px',
          sectionPaddingV: (pu * state.sectionPaddingV) + 'px',
          sectionPaddingH: (pu * state.sectionPaddingH) + 'px',
          componentGap: (pu * state.componentGap) + 'px',
        },
        typography: {
          headingClamp: `clamp(${state.headingClampMin}rem, ${state.headingClampVw}vw, ${state.headingClampMax}rem)`,
          bodySize: state.bodySize + 'rem',
          labelSize: state.labelSize + 'rem',
          labelTracking: state.labelTracking + 'em',
          trackingTight: state.trackingTight + 'em',
          trackingNormal: state.trackingNormal + 'em',
          trackingWide: state.trackingWide + 'em',
        },
        themes: state.themeColors,
        activeTheme: theme,
        collection: {
          gridSplit: state.gridSplit + '%/' + (100 - state.gridSplit) + '%',
          carouselHeight: state.carouselHeight + 'px',
          carouselFaceWidth: state.carouselFaceWidth + 'px',
        },
        variants: {
          accordion: state.accordionVariant,
          hero: state.heroVariant,
          pullQuote: state.pullQuoteVariant,
          navbar: state.navbarVariant,
          scrollIndicator: state.scrollIndicator,
          imageLayout: state.imageLayout,
        },
      };
      const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'design-tokens.json'; a.click();
      URL.revokeObjectURL(url);
    }

    function resetState() {
      if (!confirm('Reset all settings to defaults?')) return;
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      localStorage.removeItem('gaby-playground-state');
      buildPanels();
      applyState();
    }

      const panel = document.getElementById(side + '-panel');

      panel.classList.toggle('collapsed');
      btn.textContent = panel.classList.contains('collapsed')
        ? (side === 'left' ? '›' : '‹')
        : (side === 'left' ? '‹' : '›');

      setState({ mode });

      // Rebuild panels if key structural things changed (theme, snapshots)
      // For live sliders, the oninput handlers already call setState
      // Re-building panels ensures labels/values stay in sync
      buildPanels();
      // Rebuild order list
      const ol = document.getElementById('order-list');
      if (ol) ol.innerHTML = buildOrderList();
    }

    // ─── Boot ─────────────────────────────────────────────────────
    buildPanels();
    applyState();
  </script>
</body>
</html>
